services:
  - type: web
    name: staff-mb
    runtime: node
    plan: free
    rootDir: control-escenario
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_ACCESS_CODE
        sync: false
      - key: MULTIMEDIA_ACCESS_CODE
        sync: false
      - key: ESCENARIO_ACCESS_CODE
        sync: false
      - key: DATABASE_PATH
        value: /tmp/staff-mb.sqlite
